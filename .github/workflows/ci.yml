name: CommercePilot quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 · quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Aucun secret de dépôt n'est transmis à l'application ou aux tests.
      GROQ_API_KEY: ""
      GROQ_MODEL: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Mark fresh execution
        run: mkdir -p work/ci && touch work/ci/started
      - name: Run centralized quality gates
        id: quality
        run: python -m quality.check
      - name: Publish safe job summary
        if: always()
        run: python -m quality.ci_summary --outcome '${{ steps.quality.outcome }}'
      - name: Upload sanitized technical reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ci/summary.json
            work/ci/summary.md
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
